# Declarative Automation Bundle: deploys the medallion pipeline as a 3-task Databricks Job
# (bronze -> silver -> gold) instead of one monolithic notebook, so a failed stage can be
# retried on its own from the Jobs UI without re-running the stages before it.
#
# Usage (requires the Databricks CLI, authenticated separately from the .env used by
# databricks-connect -- e.g. `databricks auth login --host <workspace-url>`):
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run medallion_pipeline -t dev
bundle:
  name: databricks-medallion

resources:
  jobs:
    medallion_pipeline:
      name: medallion-pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py

targets:
  dev:
    mode: development
    default: true
